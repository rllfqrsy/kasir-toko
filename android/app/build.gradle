plugins {
    id 'com.android.application'
}

android {
    namespace 'id.co.qorsya.pos'
    compileSdk 35

    defaultConfig {
        applicationId 'id.co.qorsya.pos'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
}

tasks.register('syncWebAssets', Copy) {
    from(rootProject.projectDir.parentFile) {
        exclude 'android/**', 'test/**', '.git/**', '.gitignore', 'README.md'
    }
    into "$projectDir/src/main/assets/www"
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('syncWebAssets')
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
