<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#064e3b" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#primaryGrad)"/>
  <g transform="translate(64, 64)" filter="url(#shadow)">
    <!-- Cash Register & Shopping Basket Icon -->
    <rect x="32" y="220" width="320" height="130" rx="24" fill="#ffffff"/>
    <rect x="64" y="250" width="256" height="28" rx="8" fill="#d1fae5"/>
    <!-- Keys / Buttons -->
    <circle cx="96" cy="315" r="14" fill="#10b981"/>
    <circle cx="150" cy="315" r="14" fill="#10b981"/>
    <circle cx="204" cy="315" r="14" fill="#10b981"/>
    <rect x="240" y="301" width="70" height="28" rx="14" fill="#059669"/>
    <!-- Screen -->
    <path d="M 90 220 L 120 100 L 264 100 L 294 220 Z" fill="#ffffff" opacity="0.95"/>
    <rect x="130" y="118" width="124" height="64" rx="8" fill="#064e3b"/>
    <text x="192" y="160" fill="#34d399" font-family="monospace" font-size="28" font-weight="bold" text-anchor="middle">Rp 0</text>
    <!-- Barcode lines on top of screen / receipt slot -->
    <rect x="150" y="56" width="84" height="40" rx="4" fill="#ffffff"/>
    <line x1="162" y1="64" x2="162" y2="88" stroke="#047857" stroke-width="4"/>
    <line x1="172" y1="64" x2="172" y2="88" stroke="#047857" stroke-width="2"/>
    <line x1="180" y1="64" x2="180" y2="88" stroke="#047857" stroke-width="6"/>
    <line x1="192" y1="64" x2="192" y2="88" stroke="#047857" stroke-width="3"/>
    <line x1="202" y1="64" x2="202" y2="88" stroke="#047857" stroke-width="5"/>
    <line x1="214" y1="64" x2="214" y2="88" stroke="#047857" stroke-width="3"/>
  </g>
</svg>

